  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <g stroke="url(#trace)" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 880 90 H 1000 V 150 H 1120"/>
